<div class="min-h-screen bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md mx-auto bg-white rounded-lg shadow-md p-8">
    <h1 class="text-3xl font-bold mb-6 text-center text-gray-900">Change Password</h1>

    <form [formGroup]="changePasswordForm" (ngSubmit)="submitForm()" class="space-y-6">
      <!-- Current Password -->
      <div>
        <label for="currentPassword" class="block text-sm font-medium text-gray-700 mb-2">
          Current Password
        </label>
        <input
          type="password"
          id="currentPassword"
          formControlName="currentPassword"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          placeholder="Enter current password"
        />
        <p
          *ngIf="changePasswordForm.get('currentPassword')?.touched && changePasswordForm.get('currentPassword')?.invalid"
          class="text-red-500 text-sm mt-1"
        >
          Current password is required (min 6 characters)
        </p>
      </div>

      <!-- New Password -->
      <div>
        <label for="newPassword" class="block text-sm font-medium text-gray-700 mb-2">
          New Password
        </label>
        <input
          type="password"
          id="newPassword"
          formControlName="newPassword"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          placeholder="Enter new password"
        />
        <p
          *ngIf="changePasswordForm.get('newPassword')?.touched && changePasswordForm.get('newPassword')?.invalid"
          class="text-red-500 text-sm mt-1"
        >
          Password must be at least 6 characters with uppercase, lowercase, and number
        </p>
      </div>

      <!-- Confirm Password -->
      <div>
        <label for="confirmPassword" class="block text-sm font-medium text-gray-700 mb-2">
          Confirm Password
        </label>
        <input
          type="password"
          id="confirmPassword"
          formControlName="confirmPassword"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          placeholder="Confirm new password"
        />
        <p
          *ngIf="changePasswordForm.get('confirmPassword')?.touched && changePasswordForm.get('confirmPassword')?.invalid"
          class="text-red-500 text-sm mt-1"
        >
          Please confirm your password
        </p>
        <p
          *ngIf="changePasswordForm.hasError('passwordMismatch') && changePasswordForm.touched"
          class="text-red-500 text-sm mt-1"
        >
          Passwords do not match
        </p>
      </div>

      <!-- Submit Button -->
      <button
        type="submit"
        [disabled]="changePasswordForm.invalid || isLoading"
        class="w-full bg-blue-600 text-white py-2 rounded-lg font-semibold hover:bg-blue-700 disabled:bg-gray-400 transition duration-200"
      >
        {{ isLoading ? 'Changing...' : 'Change Password' }}
      </button>
    </form>
  </div>
</div>
