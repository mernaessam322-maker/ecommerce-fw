<div class="min-h-screen bg-gray-50 py-12">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <!-- Header -->
    <div class="mb-8">
      <h1 class="text-4xl font-bold text-gray-900 mb-2">Shop All Products</h1>
      <p class="text-gray-600">Browse our complete collection of quality products</p>
    </div>

    <!-- Loading State -->
    <div *ngIf="isLoading()" class="flex justify-center items-center h-64">
      <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
    </div>

    <!-- Products Grid -->
    <div *ngIf="!isLoading() && products().length > 0" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
      <div
        *ngFor="let product of products()"
        class="bg-white rounded-lg shadow-md overflow-hidden hover:shadow-lg transition duration-300 flex flex-col"
      >
        <!-- Product Image -->
        <div class="relative bg-gray-200 h-48 overflow-hidden">
          <img
            [src]="product.imageCover"
            [alt]="product.title"
            class="w-full h-full object-cover hover:scale-110 transition duration-300"
          />
          <div class="absolute top-2 right-2">
            <button
              (click)="addToWishlist(product._id)"
              class="bg-white rounded-full p-2 hover:bg-gray-100 transition"
              title="Add to wishlist"
            >
              <svg
                class="w-5 h-5 text-red-500"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"
                ></path>
              </svg>
            </button>
          </div>
        </div>

        <!-- Product Info -->
        <div class="p-4 flex-grow flex flex-col">
          <!-- Category -->
          <p class="text-xs text-gray-500 uppercase font-semibold mb-1">
            {{ product.category?.name }}
          </p>

          <!-- Title -->
          <h3 class="text-sm font-semibold text-gray-900 mb-2 line-clamp-2">
            {{ product.title }}
          </h3>

          <!-- Rating -->
          <div class="flex items-center mb-3">
            <div class="flex text-yellow-400">
              <span *ngFor="let _ of getStarArray(product.ratingsAverage)" class="text-xs">
                ★
              </span>
            </div>
            <span class="text-xs text-gray-600 ml-1">({{ product.ratingsQuantity }})</span>
          </div>

          <!-- Price -->
          <div class="mb-4 flex-grow">
            <span class="text-lg font-bold text-gray-900">
              {{ product.priceAfterDiscount || product.price }}
            </span>
            <span *ngIf="product.priceAfterDiscount" class="text-sm text-gray-400 line-through ml-2">
              {{ product.price }}
            </span>
          </div>

          <!-- View Details Button -->
          <button
            [routerLink]="['/details', product.slug, product._id]"
            class="w-full bg-blue-600 text-white py-2 rounded-lg font-semibold hover:bg-blue-700 transition duration-200 text-sm"
          >
            View Details
          </button>
        </div>
      </div>
    </div>

    <!-- Empty State -->
    <div *ngIf="!isLoading() && products().length === 0" class="text-center py-12">
      <p class="text-gray-600 text-lg">No products found</p>
    </div>
  </div>
</div>
